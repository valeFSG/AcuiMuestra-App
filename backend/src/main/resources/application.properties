spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/acuimuestra}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

acuimuestra.api-key=${API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

acuimuestra.gemini.api-key=${GEMINI_API_KEY:}
acuimuestra.gemini.modelo=${GEMINI_MODEL:gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-flash-latest}
acuimuestra.gemini.respaldo=${GEMINI_MODEL_RESPALDO:gemini-flash-lite-latest}
acuimuestra.groq.api-key=${GROQ_API_KEY:}
acuimuestra.groq.modelo=${GROQ_MODEL:qwen/qwen3.8-27b}
